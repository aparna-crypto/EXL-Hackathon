# Central configuration for the Agentic Model Risk Factory.
# Environment variables override selected keys (see src/factory/config.py).

project: agentic-model-risk-factory
seed: 42

paths:
  artifacts: artifacts
  model_cards: artifacts/model_cards
  audit: artifacts/audit              # gate decisions (append-only JSONL)
  llm_cache: artifacts/llm_cache      # cached LLM responses, reruns cost 0 tokens
  llm_ledger: artifacts/audit/llm_ledger.jsonl
  inventory: artifacts/inventory      # Stage 2 inventory table + dependency map
  model_docs: docs/models             # Stage 3 generated documentation (<model>.md)
  redeveloped: redeveloped            # Stage 4 Python rebuilds (<model>/<name>.py)
  redevelop_artifacts: artifacts/redevelop  # Stage 4 attempts, test results, parity.json
  parity_report: docs/parity_report.md
  validation_reports: docs/validation          # Stage 5 reports (<model>.html / .pdf)
  validation_artifacts: artifacts/validation   # Stage 5 evidence.json + charts
  monitoring_reports: docs/monitoring           # Stage 6 monitoring report (<model>.md)
  monitoring_artifacts: artifacts/monitoring   # Stage 6 batches, metrics, charts, events
  benchmark_artifacts: artifacts/benchmark     # Stage 7 benchmark json + chart
  benchmark_report: docs/benchmark.md          # Stage 7 benchmark report

llm:
  provider: anthropic                 # anthropic | fake   (env: LLM_PROVIDER)
  # null = not sent. The claude-*-5-5 models reject `temperature` (API: "deprecated for this
  # model"), so run-to-run consistency comes from the response cache instead.
  temperature: null
  default_max_tokens: 2000
  # Model used by each agent. Change models here, never in code.
  agents:
    scanner: claude-haiku-5-5
    inventory: claude-haiku-5-5
    documentation: claude-sonnet-5-5
    translation: claude-sonnet-5-5
    report: claude-sonnet-5-5
    monitor: claude-haiku-5-5
    healthcheck: claude-haiku-5-5
  # Extended thinking per agent. The claude-*-5-5 models think adaptively by default, and
  # thinking tokens count against max_tokens. Extraction agents turn it off (cheaper, and the
  # JSON answer is not cut short). Haiku accepts `disabled`; Sonnet rejects it and needs
  # `between_tools` (no thinking before the reply). Agents not listed use the model default.
  thinking:
    scanner: disabled
    inventory: disabled
    documentation: between_tools
    translation: between_tools
    report: between_tools
    monitor: disabled
    healthcheck: disabled
  # Thinking for escalation models. Opus rejects both `disabled` and `between_tools` and asks for
  # `adaptive` with an effort level instead.
  thinking_escalation:
    translation: adaptive/medium
  # Used only after `max_retries_before_escalation` failed attempts on the agent's normal model.
  escalation:
    translation: claude-opus-5-5
  max_retries_before_escalation: 3
  # USD per million tokens. ASSUMED, deliberately conservative (rounded up) because published
  # prices for these model IDs were not verified. Overestimating keeps the budget cap safe.
  pricing_usd_per_mtok:
    claude-haiku-5-5:  {input: 1.0,  output: 5.0}
    claude-sonnet-5-5: {input: 3.0,  output: 15.0}
    claude-opus-5-5:   {input: 15.0, output: 75.0}
  budget:
    # A "run" is one CLI invocation (e.g. one `make run`). Hard caps, checked BEFORE each call
    # using a worst-case estimate (estimated input + full max_tokens).
    per_run_tokens: 300000
    # Raised from $1.50 for Stage 4: worst case is 3 Sonnet + 2 Opus translation attempts at
    # 12k output tokens each (~$2.80); the pre-call check blocks any attempt that would pass this.
    per_run_usd: 1.00
    # A "session" is a named spending bucket summed across all runs from the ledger.
    # Agreed with the team: $7 for Stages 0-3 (bucket `stages-0-3`, closed at $0.948), $4 for
    # Stage 4, $2 for Stage 5 (closed at $0.069), $1 for Stage 6. Start a new bucket only on purpose.
    session_id: stage-7
    session_usd: 1.00

tracking:
  backend: local                      # local | azureml   (env: TRACKING_BACKEND)
  local_uri: artifacts/mlruns         # MLflow file store, relative to repo root
  azureml_uri_env: AZUREML_MLFLOW_URI # env var holding the workspace MLflow tracking URI
  experiment: model-risk-factory

discover:
  as_of: null                         # date for age checks (YYYY-MM-DD); null = today
  max_chars_per_file: 15000           # code/doc text sent to the inventory agent, per file
  max_tokens: 2000
  doc_max_age_months: 24              # documentation older than this is "outdated"
  # Maximum months between independent validations, by risk tier (unknown tier -> high).
  revalidation_months: {high: 12, medium: 24, low: 36}
  executable_languages: [R, Python]   # no SAS runtime in this environment
  risk_tier_rubric: |
    high: output directly drives customer credit decisions, pricing or regulatory capital /
          provisions, or the model affects large exposures or many customers.
    medium: material business use with mandatory human review of outputs, or indirect customer
          impact (e.g. alerts reviewed by analysts, limit management with overrides).
    low: internal analysis or reporting with no direct customer or financial impact.

document:
  max_chars_per_file: 15000
  # The first live scorecard reply used ~8k output tokens and hit an 8000 cap; 16000 leaves room.
  max_tokens: 16000
  # Saved outputs of the legacy run that the agent may quote (no row-level predictions).
  reference_files: [metrics.json, coefficients.csv]

redevelop:
  # Models whose source language is listed here are rebuilt in Python; others are not applicable
  # (Python models are already Python; SAS has no runtime to prove parity against).
  source_languages: [R]
  max_tokens: 12000
  max_attempts: 5                     # attempts 1-3 Sonnet, then Opus (llm.max_retries_before_escalation)
  run_timeout_s: 300                  # generated code runs in a subprocess with this timeout
  resample_seed: 7                    # second, resampled split: parity must hold on data the agent never saw
  # Parity tolerances (absolute). Labels, counts, selected variables and row ids must match exactly.
  tolerance:
    woe: 1.0e-9
    coefficient: 1.0e-6
    std_error: 1.0e-5
    pd: 1.0e-6
    score: 1.0e-4
    metric: 1.0e-9
  allowed_imports: [numpy, pandas, scipy, statsmodels, sklearn, json, math, pathlib, sys, argparse,
                    typing, dataclasses, __future__, warnings, collections, functools, itertools]

validate:
  # model_id -> evidence builder; models not listed (e.g. SAS: no runtime) are not applicable
  models: {credit_scorecard: scorecard_rebuild, fraud_gbm: binary_classifier,
           pricing_glm: poisson_frequency}
  max_tokens: 6000
  bootstrap_samples: 500              # AUC 95% CI, seed = top-level seed
  calibration_bins: 10
  psi_bins: 10
  synthetic_time_tranches: 3          # German Credit has no dates: id order stands in for time
  thresholds:                         # [green limit, amber limit]; beyond amber = red
    auc_min: [0.75, 0.65]             # test AUC
    auc_drop_max: [0.03, 0.07]        # train AUC - test AUC
    hl_pvalue_min: [0.05, 0.01]       # Hosmer-Lemeshow p-value
    calib_ratio_dev_max: [0.10, 0.20] # |mean predicted / observed rate - 1|
    psi_max: [0.10, 0.25]             # score PSI, characteristic (CSI) and feature PSI
    ae_dev_max: [0.05, 0.10]          # pricing: |actual / expected - 1| overall
    segment_ae_dev_max: [0.10, 0.20]  # pricing: worst segment with enough exposure
    air_min: [0.80, 0.70]             # adverse impact ratio of approval rates (four-fifths rule)
    eod_max: [0.10, 0.20]             # equalized odds difference
  fairness:
    protected: {credit_scorecard: [sex, age_group, foreign_worker]}
    approval_rate: 0.70               # cut-off = train score quantile giving this approval rate
    min_group_n: 30                   # smaller groups are reported, not rated
  pricing:
    segments: [Area, VehGas]
    min_segment_exposure: 1000

monitor:
  # Post-approval monitoring (Stage 6). Runs only for models whose Gate 4 is approved.
  models: {credit_scorecard: scorecard}
  months: 12                          # simulated monthly production batches
  batch_size: 1000                    # rows per batch, resampled from the test set (seed + month)
  # Drift injected from start_month; k = months since drift began (1, 2, ...).
  drift:
    start_month: 7
    amount_inflation_per_month: 0.04  # credit_amount *= 1 + rate * k
    long_term_share_per_month: 0.08   # share k * this of loans gets a longer term (product change)
    long_term_extra_months: 12        # ... of this many extra months, capped at duration_cap
    duration_cap: 72
    risk_tilt_per_month: 0.15         # resampling weight exp(tilt * k * bad): riskier intake
  # Monitored metrics reuse validate.thresholds: psi_max, calib_ratio_dev_max, auc_min.
  trigger:
    consecutive_amber: 2              # re-validate after N amber months in a row, or any red month
  max_tokens: 1500                    # monitor agent (alert narrative)

gates:
  # Every pipeline stage ends in a human gate, in this order.
  stages: [discover, document, redevelop, validate]
  # Decisions that require a written reason.
  reason_required_for: [reject, comment]

benchmark:
  # Stage 7. The manual baseline is supplied by the user; empty -> no speed-up is reported.
  manual_baseline: config/manual_baseline.yaml
