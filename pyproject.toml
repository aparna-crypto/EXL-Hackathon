[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-risk-factory"
version = "0.1.0"
description = "Agentic Model Risk Factory: document, redevelop and validate a bank model inventory (SS1/23)."
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factory = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.PydanticDeprecatedSince20",
                  "ignore:invalid value encountered in cast:RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
